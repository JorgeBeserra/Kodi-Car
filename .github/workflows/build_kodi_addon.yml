name: Build Kodi Addon ZIP and MD5

on:
  push:
    branches: [ main ]
    paths:
      - 'skin.CarPc-Carbon/**'
      - 'addons.xml'
      - '.github/workflows/build_kodi_addon.yml'
  # Verifica periodicamente se o repositório do skin tem uma versão nova
  # (um push no skin.CarPc-Carbon não dispara este workflow sozinho).
  schedule:
    - cron: '17 * * * *'   # a cada hora
  # Permite que o repositório do skin dispare este build na hora (opcional,
  # exige um token com acesso a este repositório salvo como secret no skin).
  repository_dispatch:
    types: [ skin-updated ]
  workflow_dispatch:
    inputs:
      force:
        description: 'Gerar o ZIP mesmo que esta versão já exista'
        type: boolean
        default: false

concurrency:
  group: build-kodi-addon
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Atualizar submodules para o remoto (main)
        run: |
          git submodule update --init --recursive --remote

      - name: Set up variables
        id: vars
        run: |
          ADDON_ID="skin.CarPc-Carbon"
          VERSION=$(grep -Po '^<addon[^>]*version="\K[^"]+' skin.CarPc-Carbon/addon.xml | head -n1 | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "ADDON_ID=$ADDON_ID" >> $GITHUB_ENV

      - name: Verifica se a versão já foi publicada
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          ZIP="zips/$ADDON_ID/$ADDON_ID-$VERSION.zip"
          if [ -f "$ZIP" ] && [ "$FORCE" != "true" ]; then
            echo "Versão $VERSION já publicada ($ZIP). Nada a fazer."
            echo "BUILD=false" >> $GITHUB_ENV
          else
            echo "Nova versão do skin: $VERSION"
            echo "BUILD=true" >> $GITHUB_ENV
          fi

      - name: Create addon ZIP (100% compatível)
        if: env.BUILD == 'true'
        run: |
          cd $GITHUB_WORKSPACE
          rm -f zips/$ADDON_ID/$ADDON_ID-$VERSION.zip
          zip -r zips/$ADDON_ID/$ADDON_ID-$VERSION.zip $ADDON_ID -x "$ADDON_ID/.git" "$ADDON_ID/.git/*"
        shell: bash

      - name: Atualiza versão do skin no addons.xml raiz
        if: env.BUILD == 'true'
        run: |
            sed -i "s/\(<addon id=\"skin.CarPc-Carbon\" [^>]*version=\"\)[^\"]*\(\"\)/\1$VERSION\2/" addons.xml
            grep 'skin.CarPc-Carbon' addons.xml

      - name: Generate MD5 for addons.xml
        if: env.BUILD == 'true'
        run: |
          md5sum addons.xml | awk '{print $1}' > addons.xml.md5

      - if: env.BUILD == 'true'
        run: |
          cat addons.xml
          git status
          git diff

      - name: Commit and push build artifacts
        if: env.BUILD == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Build addon ZIP and update MD5 [bot]'
          branch: main
